[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "miskeyed-app-xr-agent"
version = "0.1.0"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "exts/miskeyed.xr.adapter"}

[tool.setuptools.packages.find]
where = ["exts/miskeyed.xr.adapter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["exts/miskeyed.xr.adapter"]
