name: Kit CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kit-ci:
    name: kit-ci (official NVIDIA Kit)
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Check out app
        uses: actions/checkout@v4

      - name: Check out official NVIDIA Kit App Template
        uses: actions/checkout@v4
        with:
          repository: NVIDIA-Omniverse/kit-app-template
          ref: 483e364a4176f102f2d3c3aaf9f301a103d61d69
          path: _kit_app_template

      - name: Provision official Kit SDK
        working-directory: _kit_app_template
        run: |
          mkdir -p source/apps source/extensions
          cp ../apps/miskeyed.xr.ci.kit source/apps/
          cp -R ../exts/. source/extensions/
          cat ../kit-template/tools/deps/pip.toml >> tools/deps/pip.toml
          ./repo.sh build

      - name: Locate provisioned Kit runtime
        shell: bash
        run: |
          kit_root="_kit_app_template/_build/linux-x86_64/release"
          kit_executable="$kit_root/kit/kit"
          kit_python="$kit_root/kit/python/bin/python3"
          kit_app="$kit_root/apps/miskeyed.xr.ci.kit"
          test -x "$kit_executable"
          test -x "$kit_python"
          test -f "$kit_app"
          echo "KIT_EXECUTABLE=$kit_executable" >> "$GITHUB_ENV"
          echo "KIT_ROOT=$kit_root" >> "$GITHUB_ENV"
          echo "KIT_PYTHON=$kit_python" >> "$GITHUB_ENV"
          echo "KIT_APP=$kit_app" >> "$GITHUB_ENV"

      - name: Launch Kit, load extension, exercise USD grounding, and exit
        shell: bash
        run: |
          set -o pipefail
          "$KIT_EXECUTABLE" "$KIT_APP" \
            --ext-folder "$KIT_ROOT/exts" \
            --ext-folder "$KIT_ROOT/extsbuild" \
            --ext-folder "$KIT_ROOT/extscache" \
            --/miskeyed/kit/xr_agent/ciSmoke=true \
            --no-window | tee kit-ci.log
          grep -F "KIT_CI_PASS" kit-ci.log
          grep -F "KIT_CI_UNLOAD" kit-ci.log
