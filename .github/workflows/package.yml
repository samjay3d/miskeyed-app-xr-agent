name: Package and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-launcher:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install build
      - run: python -m build
      - run: python tests/check_wheel.py dist
      - uses: actions/upload-artifact@v4
        with: { name: launcher-distributions, path: "dist/*" }

  test-launcher:
    needs: build-launcher
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - uses: actions/download-artifact@v4
        with: { name: launcher-distributions, path: dist }
      - shell: bash
        run: python -m pip install dist/*.whl pytest
      - run: python -m pytest -q tests/test_launcher.py
      - run: miskeyed-app-xr-agent --version

  # A release tag cannot publish the launcher until both exact KAT packages pass.
  kit-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-launcher
    uses: ./.github/workflows/kit-smoke.yml

  release-gate:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-launcher, kit-release]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: "kit-package-*", path: kit, merge-multiple: true }
      - run: |
          test "$(find kit -name '*.zip' | wc -l)" -eq 2
          test "$(find kit -name '*.json' | wc -l)" -eq 2
      - uses: actions/upload-artifact@v4
        with: { name: complete-kit-release, path: "kit/*" }

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-gate
    runs-on: ubuntu-22.04
    environment: pypi
    permissions: { id-token: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: launcher-distributions, path: dist }
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-github:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-gate, publish-pypi]
    runs-on: ubuntu-22.04
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: complete-kit-release, path: release }
      - uses: actions/download-artifact@v4
        with: { name: launcher-distributions, path: release }
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "${GITHUB_REF_NAME}" release/* --verify-tag --generate-notes
