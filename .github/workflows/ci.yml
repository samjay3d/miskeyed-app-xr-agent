name: Core CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-ci:
    name: core-ci (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]

    steps:
      - name: Check out integration repository
        uses: actions/checkout@v4

      - name: Check out XR agent core
        uses: actions/checkout@v4
        with:
          repository: samjay3d/miskeyed-xr-agent
          ref: codex/create-new-repository-miskeyed-xr-agent
          path: _core

      # Ninja needs an initialized MSVC environment; GitHub's Windows image
      # installs Visual Studio but does not put cl.exe on PATH automatically.
      - name: Initialize MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure host-independent core
        run: >-
          cmake -S _core -B build/core -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DMISKEYED_XR_BUILD_OPENXR=OFF
          -DMISKEYED_XR_BUILD_PYTHON=OFF
          -DMISKEYED_XR_BUILD_EXAMPLES=ON
          -DBUILD_TESTING=ON

      - name: Build host-independent core
        run: cmake --build build/core --parallel 2

      - name: Test host-independent core
        run: ctest --test-dir build/core --output-on-failure
