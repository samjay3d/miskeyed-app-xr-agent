name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        python: ["3.10", "3.12"]

    steps:
      - name: Check out app
        uses: actions/checkout@v4

      - name: Select Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Ninja needs an initialized MSVC environment; GitHub's Windows image
      # installs Visual Studio but does not put cl.exe on PATH automatically.
      - name: Initialize MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Configure
        run: cmake --preset ci

      - name: Build and stage
        run: cmake --build --preset ci --parallel 2

      - name: Test adapter and staged core
        run: ctest --preset ci

      - name: Upload runnable stage
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: miskeyed-kit-stage-${{ matrix.os }}
          path: build/ci/stage
          if-no-files-found: error
